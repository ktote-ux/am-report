/* ─────────── Helpers ─────────── */
const normalize = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
const toNum = v => parseFloat(String(v ?? "").replace(/[^0-9.\-]/g, "")) || 0;
const money = n => n.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const fmtISO = d => d ? d.toISOString().slice(0, 10) : "";
const monthKey = d => d ? d.toLocaleDateString("en-US", { month: "short", year: "numeric" }) : "Unassigned";

const parseDate = v => {
  if (!v) return null;
  if (typeof v === "string" && v.startsWith("Date(")) {
    const [y, m, d] = v.match(/-?\d+/g).map(Number);
    return new Date(y, m, d);
  }
  const d = new Date(v);
  return isNaN(d) ? null : d;
};

/* ─────────── Ingestion Pipeline ─────────── */
function processMatrix(headers, rows) {
  const normHeaders = headers.map(h => normalize(h));
  const findCol = target => {
    const normTarget = normalize(target);
    const exact = normHeaders.indexOf(normTarget);
    if (exact !== -1) return headers[exact];
    const fuzzy = normHeaders.findIndex(h => h.includes(normTarget) || normTarget.includes(h));
    return fuzzy !== -1 ? headers[fuzzy] : target;
  };

  const keyMap = {
    date: findCol("Created Date") || findCol("Date"),
    manager: findCol("Opportunity Owner") || findCol("Owner") || findCol("Manager"),
    account: findCol("Account Name") || findCol("Account"),
    revenue: findCol("Amount") || findCol("Revenue"),
    status: findCol("Stage") || findCol("Status"),
  };

  raw = rows.map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = r[i] ?? "");
    return {
      ...obj,
      _date: parseDate(obj[keyMap.date] || obj["Last Modified Date"]),
      _revenue: toNum(obj[keyMap.revenue]),
      _account: obj[keyMap.account] || "Unnamed Account",
      _manager: obj[keyMap.manager] || "Unassigned",
      _status: obj[keyMap.status] || "01 - Refine"
    };
  });

  populateDropdowns();
  render();
  document.getElementById("status").textContent = `✅ ${raw.length} opportunities loaded · updated ${new Date().toLocaleTimeString()}`;
}

async function loadData() {
  const status = document.getElementById("status");
  status.textContent = "Connecting to Google Sheet…";

  const id = CONFIG.SHEET_URL.match(/\/d\/([a-zA-Z0-9_-]+)/)?.[1];
  if (!id) {
    loadEmbeddedFallback("Invalid URL — loaded embedded dataset");
    return;
  }

  const url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json&headers=1`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    
    // Clean GViz wrapper
    const cleanJson = text.replace(/^.*setResponse\(|\);?$/gs, '').trim();
    const json = JSON.parse(cleanJson);
    if (json.status === "error") throw new Error(json.errors?.[0]?.detailed_message || "Sheet error");

    let headers = json.table.cols.map(c => c.label || "");
    let rowsRaw = json.table.rows;
    if (headers.every(h => !h) && rowsRaw.length) {
      headers = rowsRaw[0].c.map(c => c?.v ?? "");
      rowsRaw = rowsRaw.slice(1);
    }

    const dataMatrix = rowsRaw.map(r => r.c.map(cell => cell?.f ?? cell?.v ?? ""));
    processMatrix(headers, dataMatrix);
  } catch (err) {
    console.warn("Live fetch failed (likely private Google Sheet), loading embedded fallback:", err);
    loadEmbeddedFallback("Private Sheet detected — loaded direct pipeline data");
  }
}

function loadEmbeddedFallback(reason) {
  const headers = EMBEDDED_DATA[0];
  const rows = EMBEDDED_DATA.slice(1);
  processMatrix(headers, rows);
  document.getElementById("status").textContent = `ℹ️ ${reason} (${raw.length} records active)`;
}

/* ─────────── Filters & Search ─────────── */
function populateDropdowns() {
  const fill = (el, vals, label) => {
    el.innerHTML = `<option value="">${label}</option>` +
      [...new Set(vals.filter(Boolean))].sort().map(v => `<option value="${v}">${v}</option>`).join("");
  };
  fill(document.getElementById("managerFilter"), raw.map(r => r._manager), "All Owners");
  fill(document.getElementById("statusFilter"),  raw.map(r => r._status),  "All Stages");
}

function setRange(days) {
  const from = document.getElementById("dateFrom"), to = document.getElementById("dateTo");
  const now = fmtISO(new Date());
  if (days === "all")      { from.value = ""; to.value = ""; }
  else if (days === "ytd") { from.value = fmtISO(new Date(new Date().getFullYear(), 0, 1)); to.value = now; }
  else                     { from.value = fmtISO(new Date(Date.now() - days * 864e5)); to.value = now; }
  render();
}

function getFiltered() {
  const from = document.getElementById("dateFrom").value;
  const to   = document.getElementById("dateTo").value;
  const mgr  = document.getElementById("managerFilter").value;
  const st   = document.getElementById("statusFilter").value;

  return raw.filter(r => {
    if (from && r._date && r._date < new Date(from)) return false;
    if (to && r._date && r._date > new Date(to + "T23:59:59")) return false;
    if (view === "manager" && mgr && r._manager !== mgr) return false;
    if (st && r._status !== st) return false;
    return true;
  });
}

/* ─────────── Tabs ─────────── */
function setTab(t) {
  view = t;
  const on = "rounded-lg bg-blue-600 px-4 py-2 text-xs font-semibold text-white shadow-sm transition hover:bg-blue-700";
  const off = "rounded-lg border border-slate-300 bg-white px-4 py-2 text-xs font-semibold text-slate-700 shadow-sm transition hover:bg-slate-50";
  document.getElementById("tab-leadership").className = t === "leadership" ? on : off;
  document.getElementById("tab-manager").className = t === "manager" ? on : off;
  document.getElementById("managerFilter").classList.toggle("hidden", t !== "manager");
  document.getElementById("barCard").classList.toggle("hidden", t !== "leadership");
  render();
}
